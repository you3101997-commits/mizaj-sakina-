,{e:"⭐",t:"أريد الاستعداد لقيام الليل",msg:"قيام الليل عبادة عظيمة، لكن لا تجعل الرغبة في الكثير سببًا لترك القليل.",action:"اختر خطة يسيرة لليلة تراعي قدرتك وصحتك."},{e:"🧠",t:"أشعر بالتشتت وأريد التركيز",msg:"التشتت قد يحدث بسبب كثرة المهام أو التعب أو التنبيهات.",action:"حدد مهمة واحدة، واجعل أول جلسة تركيز عشر دقائق."},{e:"🧱",t:"أشعر بالضغط من المسؤوليات",msg:"حين تتراكم المسؤوليات، قد يبدو كل شيء عاجلًا، فتشعر أنك لا تستطيع البدء.",action:"أعد ترتيب المهام بدل محاولة إنجازها كلها في وقت واحد."},{e:"🫶",t:"أفتقد شخصًا عزيزًا",msg:"الاشتياق قد يأتي على موجات، وقد تذكرك تفاصيل صغيرة بمن تحب.",action:"اختر طريقة آمنة لتكريم الذكرى أو مشاركة شعورك."},{e:"📉",t:"أشعر أنني فشلت",msg:"التعثر في مهمة أو علاقة أو هدف لا يساوي فشل حياتك كلها.",action:"استخرج درسًا واحدًا من التجربة ثم قرر الخطوة التالية."},{e:"🌱",t:"أريد أن أبدأ من جديد",msg:"البداية الجديدة لا تحتاج إلى إعلان كبير أو خطة مثالية.",action:"ابدأ بخطوة واحدة اليوم بدل انتظار الظروف المثالية."},{e:"🧘",t:"أريد فقط الهدوء",msg:"لا يلزم أن تشرح شعورك أو تجد له اسمًا الآن.",action:"اختر دقيقة واحدة بلا مطالب، ثم قرر ما تحتاجه بعدها."}],Ku={"حزين ومهموم":{intro:"أحيانًا تتراكم الهموم واحدة بعد الأخرى؛ همّ الرزق، والخوف من المستقبل، ومواقف لا نستطيع شرحها لأحد. قد تبدو متماسكًا أمام الناس ثم تشعر بثقل كبير حين تختلي بنفسك. لا تقسُ على قلبك ولا تطالب نفسك بحل كل شيء اليوم. حزنك لا ينتقص من قيمتك، وطلب المساندة ليس ضعفًا.",quote:"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",steps:["اجلس في مكان مريح وأرخِ كتفيك، وتنفس بصورة طبيعية دون إجبار نفسك.","اكتب همًّا واحدًا يشغلك، ثم اكتب بجانبه خطوة صغيرة ممكنة اليوم. أجّل ما لا تستطيع حله الآن.","تواصل مع شخص تثق به وقل له: «أنا أمرّ بوقت صعب، هل يمكنك أن تسمعني قليلًا؟»"],dua:"يا رب، أنا متعب وأنت أعلم بما في قلبي؛ اشرح صدري، ويسّر أمري، وفرّج همّي، وارزقني سكينة تعينني على الخطوة القادمة.",note:"إذا كان ضيق الصدر جسديًا شديدًا أو جديدًا، أو صاحبه ألم أو صعوبة في التنفس، فاطلب المساعدة الطبية العاجلة."},"مريض ومتعب":{intro:"عندما يتعب الجسد، قد تتعب معه المشاعر ويصبح القيام بالأمور المعتادة أصعب. لا تلُم نفسك إن احتجت إلى الراحة أو إلى مساعدة الآخرين. الاعتناء بنفسك ليس كسلًا، والشفاء قد يحتاج وقتًا ومتابعة وصبرًا.",quote:"اللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِي",steps:["امنح نفسك راحة مناسبة واطلب من شخص قريب مساعدتك في أمر محدد.","اتبع إرشادات مقدم الرعاية الصحية ولا تؤخر طلب الرعاية عند وجود أعراض مقلقة.","اختر نشاطًا بسيطًا يريحك دون أن يزيد الألم أو الإرهاق."],dua:"اللهم ارزقني العافية والشفاء، وأعنّي على الأخذ بالأسباب، وارزقني الصبر والطمأنينة."},"مديون ومشغول البال":{intro:"الالتزامات المالية قد تجعل الذهن مشغولًا طوال اليوم، لكن الدين لا يختصر قيمتك ولا يحدد مستقبلك كله. بدل أن تواجه الأرقام ككتلة واحدة مخيفة، حاول رؤيتها بوضوح ومن دون لوم نفسك.",quote:"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا",steps:["دوّن الالتزامات والمواعيد الأساسية في ورقة واحدة.","حدّد الضروريات أولًا، ثم تواصل مع الدائن بشأن خطة سداد واقعية إن أمكن.","استشر شخصًا موثوقًا في التخطيط المالي، وتجنب الوعود أو الاقتراض المتسرع."],dua:"اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك."},"فارغ وملّان":{intro:"الفراغ قد يجعل الوقت ثقيلًا، وقد يصعب عليك الشعور بالحماس حتى تجاه أشياء كنت تحبها. لا تحتاج إلى تغيير حياتك كلها كي تبدأ؛ أحيانًا يساعدك فعل صغير على استعادة الإحساس بالحركة والاختيار.",quote:"فَإِذَا فَرَغْتَ فَانصَبْ",steps:["اختر نشاطًا قصيرًا لمدة خمس دقائق فقط.","غيّر مكان جلوسك أو امشِ قليلًا إن كانت حالتك تسمح.","تواصل مع شخص أو تعلم شيئًا صغيرًا بدل انتظار الحماس حتى يأتي."],dua:"اللهم بارك لي في وقتي، واهدني لما ينفعني، وافتح لي أبواب الخير."},"قلق وخائف":{intro:"القلق يحاول أحيانًا أن يجعلك تعيش أحداثًا لم تقع بعد. لا تحتاج إلى تصديق كل فكرة مخيفة، ولا إلى حل المستقبل كله الآن. أعد انتباهك إلى اللحظة الحالية، وميّز بين ما تعرفه فعلًا وما تخشاه.",quote:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",steps:["لاحظ قدميك على الأرض وسمِّ أشياء تراها حولك، ثم تنفس بصورة طبيعية.","اسأل نفسك: ما الدليل على هذه الفكرة؟ وما الخطوة المتاحة الآن؟","قلّل المنبهات أو المحتوى الذي يزيد توترك، واطلب المساندة إذا صار القلق يعطل حياتك."],dua:"اللهم أنزل السكينة على قلبي، وأعنّي على ما أستطيع فعله، واصرف عني الخوف الذي يرهقني."},"غاضب ومتوتر":{intro:"الغضب قد يظهر عندما تشعر بالضغط أو الظلم أو أن احتياجاتك لم تُسمع. وجود الشعور لا يعني أن عليك التصرف وفقه فورًا. امنح نفسك مهلة حتى لا تقول ما تندم عليه.",quote:"وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ",steps:["أجّل الرد أو الرسالة حتى تهدأ، وابتعد عن الموقف إن كان ذلك آمنًا.","استعذ بالله، واسترخِ، وخذ أنفاسًا طبيعية هادئة.","عندما تهدأ، عبّر عن أثر الموقف واحتياجك دون تهديد أو إهانة."],dua:"اللهم اهد قلبي، وأصلح لساني، وأعنّي على ضبط نفسي والعدل في كلامي."},"مكسور الخاطر":{intro:"الخذلان أو الكلام الجارح قد يترك أثرًا عميقًا، خصوصًا عندما يأتي من شخص كنت تثق به. لا تجعل تصرف شخص آخر حكمًا نهائيًا على قيمتك. امنح نفسك وقتًا لفهم ما حدث، ولا تضغط على نفسك لتسامح أو تتجاوز قبل أن تكون مستعدًا.",quote:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",steps:["اكتب ما جرحك وما كنت تتمنى أن يحدث، دون أن ترسل الرسالة الآن.","تحدث مع شخص أمين يسمعك دون التقليل من شعورك.","فكر في الحد الذي يحفظ كرامتك وأمانك إذا تكرر الموقف."],dua:"اللهم اجبر خاطري، وأبدل ألمي سكينة، وارزقني الحكمة فيما أختار وما أترك."},"فرحان وممتن":{intro:"من الجميل أن تلاحظ لحظات الفرح وأن تمنحها مكانًا في قلبك، حتى لو لم تكن حياتك خالية من المشكلات. الامتنان لا يعني إنكار التعب، بل ملاحظة الخير الموجود إلى جانبه.",quote:"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ",steps:["سمِّ ثلاث نعم محددة تشعر بالامتنان لها اليوم.","شارك فرحتك أو كلمة طيبة مع شخص تحبه.","احتفظ بذكرى جميلة أو اكتبها لتعود إليها في الأيام الصعبة."],dua:"الحمد لله على ما أعطى، اللهم أعنّي على شكرك وحسن استعمال نعمك."},"أحتاج قوة":{intro:"القوة ليست أن تنجز كل شيء وحدك أو ألا تتعب أبدًا. أحيانًا تكون القوة أن تعترف بحاجتك إلى الراحة، أو أن تبدأ من جديد بعد التعثر، أو أن تطلب المساعدة في الوقت المناسب.",quote:"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",steps:["اختر مهمة واحدة صغيرة يمكن إنجازها خلال خمس دقائق.","قسّم الأمر الصعب إلى خطوات واضحة، واطلب المساعدة في الجزء الذي لا تستطيع حمله وحدك.","بعد الخطوة الأولى، خذ استراحة قصيرة وقدّر محاولتك."],dua:"اللهم قوّني لما فيه خير، وأعنّي على ما ينفعني، وارزقني صبرًا وحكمة."},"أحتاج القرب من الله":{intro:"يمكن أن تبدأ علاقتك بالعبادة من لحظة صادقة وبسيطة، دون أن تثقل على نفسك بما يفوق قدرتك. إن كنت متعبًا، فابدأ بما تستطيع من ذكر أو دعاء أو صلاة بحسب استطاعتك.",quote:"فَاذْكُرُونِي أَذْكُرْكُمْ",steps:["اختر ذكرًا واحدًا ورده بهدوء مع حضور القلب.","ادعُ الله بكلماتك أنت، واذكر ما تحتاج إليه بصراحة.","اختر عبادة يسيرة تستطيع المواظبة عليها، واستفسر من مصدر موثوق عن المسائل الشرعية."],dua:"يا رب، قرّبني إليك، وأصلح قلبي، وأعنّي على ذكرك وشكرك وحسن عبادتك."},"أشعر بالوحدة":{intro:"الشعور بالوحدة قد يكون مؤلمًا حتى عندما يوجد الناس حولك. احتياجك إلى من يسمعك ويفهمك احتياج إنساني طبيعي، وليس دليلًا على ضعفك. لا يلزم أن تشرح كل شيء مرة واحدة.",quote:"وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ",steps:["أرسل لشخص تثق به: «أحتاج إلى الحديث قليلًا، هل لديك وقت؟»","اختر مكانًا آمنًا تشعر فيه بالراحة، أو نشاطًا بسيطًا يتيح تواصلًا لطيفًا.","إذا طال الشعور بالوحدة وأثر في حياتك، فكّر في الاستعانة بمختص أو مجموعة دعم."],dua:"اللهم آنس وحشتي، وارزقني صحبة صالحة وقلوبًا رحيمة، وأعنّي على التواصل وطلب المساندة."},"مرهق وأحتاج راحة":{intro:"حين يتراكم الإرهاق، قد تبدو حتى المهام البسيطة صعبة. الراحة ليست فشلًا ولا مكافأة لا تستحقها إلا بعد إنجاز كل شيء؛ إنها من احتياجاتك الأساسية.",quote:"وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا",steps:["اختر مهمة يمكن تأجيلها بأمان، وامنح نفسك استراحة قصيرة.","اشرب الماء وتناول طعامًا مناسبًا إن كنت تحتاج إليه، وهيئ مكانًا مريحًا.","إذا استمر التعب أو كان شديدًا أو غير معتاد، فاطلب تقييمًا طبيًا مناسبًا."],dua:"اللهم ارزقني راحة تعينني، وعافية تحفظني، وبركة في وقتي وطاقتي."},"أشعر بالخوف":{intro:"الخوف شعور إنساني يظهر أحيانًا عندما لا تكون الصورة واضحة أو عندما نتوقع خطرًا. لا يعني وجوده أنك ضعيف، ولا يلزم أن تتخذ قرارًا وأنت في ذروة الانفعال.",quote:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",steps:["انظر حولك وسمِّ ثلاثة أشياء تراها لتعود إلى اللحظة الحالية.","اسأل نفسك: هل يوجد خطر مباشر الآن؟ وما التصرف الآمن الممكن؟","تحدث إلى شخص تثق به إذا كان الخوف شديدًا أو متكررًا."],dua:"اللهم إني أسألك الأمن والطمأنينة، وأعوذ بك من الهم والحزن والعجز والكسل.",note:"إن كان هناك خطر حقيقي مباشر، ابتعد إلى مكان آمن واطلب المساعدة المناسبة فورًا."},"أشعر بضيق في الصدر":{intro:"قد يكون الضيق وصفًا لشعور داخلي ثقيل، وقد يكون أحيانًا عرضًا جسديًا يحتاج إلى الانتباه. لا تتجاهل العلامات الجسدية.",quote:"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",steps:["اجلس في وضع مريح واترك التنفس طبيعيًا دون إجبار أو حبس.","أخبر شخصًا قريبًا بما تشعر به إذا احتجت إلى وجوده.","إن تكرر الضيق أو أثر في يومك، استشر مختصًا صحيًا."],dua:"اللهم اشرح صدري ويسّر أمري، وارزقني السكينة والعافية.",note:"إن كان الضيق شديدًا أو جديدًا أو صاحبه ألم صدر أو صعوبة تنفس أو دوخة شديدة، فاطلب مساعدة طبية عاجلة."},"أشعر بالإرهاق والتعب":{intro:"عندما تنخفض الطاقة، قد تبدو أبسط المهام أكبر من المعتاد. ليس مطلوبًا أن تعمل بالمستوى نفسه كل يوم؛ فالقدرة تتغير مع النوم والصحة والضغوط.",quote:"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا",steps:["اختر مهمة واحدة ضرورية وأجّل ما يمكن تأجيله.","اشرب الماء وتناول طعامًا مناسبًا إن كان ذلك متاحًا ومناسبًا لك.","اطلب مساعدة محددة بدل محاولة حمل كل شيء وحدك."],dua:"اللهم أعنّي ولا تعن عليّ، ويسّر لي ما فيه خير، وارزقني العافية."},"فقدت الحماس":{intro:"فقدان الحماس لا يعني أنك كسول أو أنك فقدت قدرتك على التغيير. أحيانًا يكون نتيجة ضغط طويل أو تعب أو خيبة، وقد يحتاج إلى وقت ومساندة.",quote:"فَإِذَا فَرَغْتَ فَانصَبْ",steps:["اختر نشاطًا بسيطًا لمدة خمس دقائق فقط.","ابدأ بشيء كنت تحبه دون أن تشترط أن تستمتع به فورًا.","تواصل مع شخص تثق به إذا استمر الانطفاء الداخلي."],dua:"اللهم ارزقني نشاطًا فيما ينفعني، وراحة تعينني، وأملًا يهديني إلى الخطوة التالية.",note:"إذا استمر فقدان المتعة أو أثر في حياتك لأسابيع، فالتحدث إلى مختص قد يكون مفيدًا."},"أشعر بالغضب":{intro:"الغضب قد يخبرك أن حدًا قد تم تجاوزه أو أن أمرًا مهمًا يؤلمك، لكنه لا يلزم أن يقود تصرفك. امنح نفسك مسافة آمنة قبل الرد.",quote:"وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ",steps:["توقف عن الرد لدقائق إن كان ذلك آمنًا.","ابتعد عن الموقف مؤقتًا واستعذ بالله إن أحببت.","عندما تهدأ، صف ما حدث وما تحتاجه دون تهديد أو تجريح."],dua:"أعوذ بالله من الشيطان الرجيم."},"أنا محتار ولا أعرف ماذا أفعل":{intro:"الحيرة لا تعني أنك عاجز عن اتخاذ القرار؛ قد تعني فقط أن الخيارات كثيرة أو أن المعلومات غير مكتملة. لا تحاول حل كل الاحتمالات في ذهنك دفعة واحدة.",quote:"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا",steps:["اكتب الخيارات المتاحة دون تقييم فوري.","حدد أهم معيارين للقرار، مثل السلامة والقدرة والوقت.","اختر خطوة لجمع معلومة ناقصة بدل مطالبة نفسك بحسم كل شيء الآن."],dua:"اللهم اهدني وسددني، واختر لي الخير حيث كان، ويسّر لي اتباعه."},"أشعر بالذنب وأريد التوبة":{intro:"الندم قد يكون بداية إصلاح نافعة، لكنه لا يحتاج أن يتحول إلى عقوبة مستمرة للنفس. في الإسلام باب التوبة مفتوح، ومن التوبة الإقلاع عن الذنب والندم والعزم على عدم العودة.",quote:"قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",steps:["اعترف بما حدث بصدق دون تهويل أو تبرير.","أصلح ما تستطيع ورد الحقوق إن كانت هناك حقوق للآخرين.","ضع سببًا عمليًا يساعدك على تجنب تكرار الخطأ، ثم ارجع إلى الطاعة."],dua:"رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ."},"أمر بضائقة مالية أو دين":{intro:"الضائقة المالية تضغط على التفكير والعلاقات والنوم، ومن الطبيعي أن تشعر بالثقل. لكنها لا تختصر قيمتك ولا تعني أن الحل يجب أن يظهر كله اليوم.",quote:"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا",steps:["دوّن المبالغ والمواعيد والضروريات الأساسية بوضوح.","رتّب السداد بحسب الاستحقاق والقدرة، واطلب تفاهمًا واقعيًا إن أمكن.","احذر العروض التي تعد بربح مضمون أو تطلب رسومًا مسبقة غير واضحة."],dua:"اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك."},"أعاني من المرض أو الألم":{intro:"المرض قد يستنزف الجسد والمزاج معًا، وقد تحتاج إلى تقليل التوقعات من نفسك خلال هذه الفترة. الراحة وطلب المساندة والأخذ بالأسباب ليست نقصًا في الصبر.",quote:"وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ",steps:["حدد ما تحتاجه اليوم: راحة أو دواء موصوف أو مساعدة في مهمة.","أخبر شخصًا قريبًا بما يمكنه فعله لمساندتك.","اطلب رعاية طبية مناسبة إذا ساءت الأعراض أو أقلقتك."],dua:"اللهم رب الناس، أذهب البأس، اشفِ أنت الشافي، لا شفاء إلا شفاؤك، شفاءً لا يغادر سقمًا."},"أحتاج إلى القوة والصبر":{intro:"القوة ليست أن تتحمل كل شيء وحدك، والصبر ليس أن تتجاهل حاجتك للراحة. قد تكون القوة في طلب المساندة، أو وضع حد، أو المحاولة من جديد بعد تعثر.",quote:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",steps:["حدد أمرًا واحدًا يقع ضمن قدرتك اليوم.","اطلب مساعدة محددة في جانب يثقل عليك.","ذكّر نفسك بما تجاوزته، دون أن تجبر نفسك على إنكار الألم الحالي."],dua:"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ."},"أريد الهدوء قبل النوم":{intro:"حين يقترب النوم، قد تظهر الأفكار التي أجلتها طوال اليوم. لا تحتاج إلى حلها كلها على الوسادة. دوّن ما يشغلك وما ستعود إليه غدًا.",quote:"وَجَعَلْنَا اللَّيْلَ لِبَاسًا",steps:["اكتب فكرة تشغلك وخطوة ستعود إليها غدًا.","خفف الإضاءة وأبعد الهاتف إن استطعت.","اقرأ أذكار النوم الثابتة من مصدر موثوق إن رغبت."],dua:"باسمك اللهم أموت وأحيا."},"أحتاج إلى السكينة قبل الصلاة":{intro:"قد تدخل الصلاة وذهنك مزدحم بما حدث خلال اليوم. لا تنتظر أن تختفي كل الأفكار حتى تبدأ؛ هيئ نفسك بما تستطيع.",quote:"فَاذْكُرُونِي أَذْكُرْكُمْ",steps:["اترك الهاتف بعيدًا لدقائق قبل الصلاة.","خذ وقتك في الوضوء دون إسراف أو وسوسة.","ابدأ الصلاة وارجع إلى القراءة كلما لاحظت التشتت."],dua:"اللهم أعنّي على ذكرك وشكرك وحسن عبادتك."},"أريد الاستعداد لقيام الليل":{intro:"قيام الليل عبادة عظيمة، لكن لا تجعل الرغبة في الكثير سببًا لترك القليل. ابدأ بما تستطيع مع مراعاة صحتك وحقوق جسدك وواجباتك.",quote:"وَمِنَ اللَّيْلِ فَتَهَجَّدْ بِهِ نَافِلَةً لَّكَ",steps:["هيئ مكان الصلاة وما تحتاجه قبل النوم.","اختر مقدارًا يسيرًا يمكنك الاستمرار عليه.","إذا غلبك النوم أو احتجت للراحة، فتعامل مع نفسك برفق."],dua:"اللهم أعنّي على ذكرك وشكرك وحسن عبادتك."},"أشعر بالتشتت وأريد التركيز":{intro:"التشتت قد يحدث بسبب كثرة المهام أو التعب أو التنبيهات. لا تحتاج إلى إجبار ذهنك على التركيز لساعات؛ ابدأ بتقليل المشتتات وتحديد مهمة واحدة ووقت قصير.",quote:"فَإِذَا فَرَغْتَ فَانصَبْ",steps:["اكتب مهمة واحدة فقط تريد البدء بها.","أوقف إشعارًا أو أبعد مصدر تشتيت لمدة عشر دقائق.","اعمل لفترة قصيرة ثم خذ استراحة مناسبة."],dua:"اللهم انفعني بما علمتني وعلمني ما ينفعني وزدني علمًا."},"أشعر بالضغط من المسؤوليات":{intro:"حين تتراكم المسؤوليات، قد يبدو كل شيء عاجلًا، فتشعر أنك لا تستطيع البدء. جرب أن تخرج المهام من ذهنك إلى قائمة، ثم تميز بين الضروري والعاجل وما يمكن تفويضه.",quote:"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا",steps:["اكتب كل ما يشغل بالك في قائمة واحدة.","اختر ثلاث أولويات كحد أقصى لهذا اليوم.","أخبر من يعنيه الأمر إذا كنت تحتاج إلى تمديد أو مساعدة."],dua:"اللهم لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحزن إذا شئت سهلًا."},"أفتقد شخصًا عزيزًا":{intro:"الاشتياق قد يأتي على موجات، وقد تذكرك تفاصيل صغيرة بمن تحب. لا توجد طريقة واحدة صحيحة للتعامل مع الفقد؛ يمكنك أن تحزن، وأن تتحدث عن الشخص، وأن تحتفظ بذكرى طيبة.",quote:"وَبَشِّرِ الصَّابِرِينَ",steps:["اسمح لنفسك بتسمية ما تفتقده دون لوم.","اكتب ذكرى جميلة أو رسالة لا يلزم إرسالها.","تواصل مع شخص يفهمك إذا شعرت أن الحزن يثقل عليك."],dua:"اللهم ارحم من نحب، واجبر قلوبنا، وارزقنا الصبر والسكينة."},"أشعر أنني فشلت":{intro:"التعثر في مهمة أو علاقة أو هدف لا يساوي فشل حياتك كلها. من الطبيعي أن تحتاج إلى وقت لتستوعب ما حدث، ثم تستطيع النظر إليه كخبرة يمكن التعلم منها.",quote:"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",steps:["اكتب ما حدث كما لو كنت تصفه لشخص محايد.","حدد شيئًا واحدًا تعلمته وشيئًا واحدًا يمكنك تغييره.","اختر خطوة صغيرة لإعادة المحاولة أو إصلاح الضرر."],dua:"اللهم ألهمني رشدي، وقني شر نفسي، ويسّر لي ما فيه خير."},"أريد أن أبدأ من جديد":{intro:"البداية الجديدة لا تحتاج إلى إعلان كبير أو خطة مثالية. يمكنك أن تبدأ بهدوء من نقطة واقعية، وتختار عادة صغيرة أو أمرًا واحدًا تريد إصلاحه.",quote:"وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ",steps:["اختر مجالًا واحدًا تريد تحسينه.","اجعل أول خطوة قصيرة وواضحة ويمكن فعلها اليوم.","حدد ما قد يعطلك وكيف ستتعامل معه برفق."],dua:"اللهم اهدني وسددني، ويسّر لي الخير حيث كان."},"أريد فقط الهدوء":{intro:"لا يلزم أن تشرح شعورك أو تجد له اسمًا الآن. يمكنك أن تمنح نفسك بضع دقائق بلا أسئلة ولا مطالب. اجلس كما يريحك، لاحظ ما حولك، واترك التنفس طبيعيًا.",quote:"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",steps:["ضع قدميك على الأرض ولاحظ ما يسند جسدك.","اختر شيئًا واحدًا تراه أو تسمعه وركز عليه للحظات.","إذا رغبت، ردد ذكرًا تحبه دون عدّ أو استعجال."],dua:"اللهم أنزل على قلبي سكينة ورحمة، ويسّر لي ما أحتاج إليه."}};function qo(p){const x=[{text:"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",source:"الرعد: 28",tafsir:"القلب حين يضطرب ويقلق لا يهدأ بأي شيء من الدنيا مهما كان — لا المال ولا الناس ولا المتع. لكن الله سبحانه يخبرنا أن لقلبك سرًا: لا يطمئن إلا بذكره. والطمأنينة هنا ليست غياب المشاكل، بل سكينة داخلية تعينك على التعامل مع المشاكل. حين تذكر الله بصدق وحضور، يشعر قلبك أن هناك من هو أكبر من كل ما يخيفك، وأنك لست وحدك في هذا."},{text:"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا",source:"الشرح: 5-6",tafsir:"الله سبحانه كرّر هذه الآية مرتين في سورة واحدة، وكأنه يقول لك: تأكّد، تأكّد. فالعسر وقت محدود، واليسر قادم لا محالة. واليسر هنا قد يكون حلًا للمشكلة، أو مخرجًا لم تتوقعه، أو قوة داخلية تعينك على تحمّل الصعوبة حتى تزول. الأهم أن توقيت اليسر بيد الله، وقد يكون قريبًا جدًا وأنت لا تشعر."},{text:"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",source:"الزمر: 53",tafsir:"هذه الآية خطاب مباشر لكل من أذنب وأسرف وظلم نفسه، ومن كل من شعر أنه بلغ حدًا لا رجعة بعده. الله سبحانه يفتح الباب على مصراعيه: لا تيأسوا. رحمته أوسع من ذنوبك كلها، وأوسع من أحزانك كلها، وأوسع من ماضيك كله. اليأس من رحمة الله هو العبء الحقيقي، لأنه يقطعك عن مصدر الأمل الوحيد."},{text:"وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ",source:"الحديد: 4",tafsir:"المعية هنا ليست معية مكان بل معية علم وسمع وبصر ورعاية. الله يعلم ما تمر به الآن، يسمع همهمتك في جوف الليل، يرى دمعتك حين لا يراها أحد. هذه المعية تمنحك شعورًا بأنك لست منسيًا ولا مهجورًا، حتى لو شعر الناس أنك بخير ولم يلاحظوا ثقلك."},{text:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",source:"البقرة: 153",tafsir:"الصبر ليس أن تتحمل بصمت ولا أن تتظاهر بأنك بخير. الصبر في القرآن يعني أن تثبت وتستمر في فعل الخير والصواب رغم الألم، وأن لا تنقطع عن الدعاء والأسباب. ومعية الله للصابرين معية خاصة — معية تأييد ونصر وتثبيت، تمنحك قوة لا تأتي من نفسك بل من خالقك."}],u=[{text:"«عَجَبًا لأَمْرِ المُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ، وَلَيْسَ ذَاكَ لأَحَدٍ إِلَّا لِلْمُؤْمِنِ: إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ فَكَانَ خَيْرًا لَهُ، وَإِنْ أَصَابَتْهُ ضَرَّاءُ صَبَرَ فَكَانَ خَيْرًا لَهُ»",source:"صحيح مسلم، 2999"},{text:"«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلَا تَعْجَزْ»",source:"صحيح مسلم، 2664"},{text:"«وَمَنْ يَتَصَبَّرْ يُصَبِّرْهُ اللَّهُ»",source:"صحيح البخاري، 1469"},{text:"«مَا يُصِيبُ الْمُسْلِمَ مِنْ نَصَبٍ وَلَا وَصَبٍ وَلَا هَمٍّ وَلَا حَزَنٍ وَلَا أَذًى وَلَا غَمٍّ، حَتَّى الشَّوْكَةِ يُشَاكُهَا، إِلَّا كَفَّرَ اللَّهُ بِهَا مِنْ خَطَايَاهُ»",source:"صحيح البخاري ومسلم"},{text:"«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ»",source:"صحيح البخاري"},{text:"«يَسِّرُوا وَلَا تُعَسِّرُوا، وَبَشِّرُوا وَلَا تُنَفِّرُوا»",source:"صحيح البخاري ومسلم"}];let j=x,k=u,y=`لا تحتاج إلى إصلاح حياتك كلها اليوم، ولا يلزم أن تتحول إلى شخص مختلف كي تستحق الراحة والاحترام. ابدأ من الحقيقة التي تعيشها الآن: سمِّ شعورك كما هو، ولا تهاجِم نفسك بسبب وجوده. المشاعر إشارات تحتاج إلى فهم، وليست أحكامًا نهائية على شخصيتك أو مستقبلك.

امنح نفسك مساحة تجمع فيها بين الإيمان والأخذ بالأسباب: استعِن بالله، ثم اختر خطوة صغيرة واضحة تستطيع فعلها اليوم. قد تكون كتابة ما يشغلك، أو ترتيب مكانك، أو التواصل مع شخص أمين، أو إنجاز مهمة قصيرة، أو أخذ قسط من الراحة. اجعل الهدف واقعيًا ومناسبًا لطاقتك، ولا تجعل يومك اختبارًا لقيمتك.

تذكّر أن الرحلة الطويلة لا تُقطع إلا بخطوة واحدة في كل مرة. لا تقارن بدايتك بمنتصف غيرك، فقد تكون أنت أقوى مما تظن، والصعوبات التي تجتازها بصمت هي التي تبني فيك قوة لا يراها أحد اليوم ولكن سيراها الجميع غدًا. ثق بأن الله لم يخلقك ليعذبك، بل ليبتليك فيثيبك، وليختبرك فيقويك. أنت أهل للخير، والخير قادم إليك من أبواب ربما لم تتوقعها.`;return/أحتاج قوة|قوة|شجاعة|القوة والصبر/.test(p)?(j=[{text:"لَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ",source:"آل عمران: 139",tafsir:"هذه الآية نزلت في غزوة أحد حين كان المسلمون في أضعف حالاتهم — جرحى، منهكون، خسروا المعركة. فقال الله لهم: لا تضعفوا ولا تحزنوا، فأنتم الأعلون. الأعلون لا لأنكم انتصرتم في المعركة، بل لأنكم على الحق، والحق لا يُقهر وإن خُذل في جولة. أنت أيضًا قد تخسر جولة في حياتك، لكن ذلك لا يجعلك مهزومًا ما دمت على الطريق الصحيح."},{text:"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا",source:"الشرح: 5-6",tafsir:"تأمل كيف كرّر الله اليسر مرتين مقابل العسر مرة واحدة. هذا توازن رباني يخبرك أن الخير أوسع من الشر، والفرج أقرب من الضيق، والمخرج أكبر من المشكلة. قد لا تراه الآن لأنك داخل العسر، لكن الآية تعدك بأن اليسر مع العسر لا بعده — أي أنه يرافقه حتى في أثناء الصعوبة."},{text:"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا",source:"البقرة: 286",tafsir:"هذه الآية سترة لقلبك: الله يعلم قدرتك بالضبط، ولا يطلب منك ما يفوقها. فإن شعرت أن الحمل ثقيل، فاعلم أنه قابل للتحمل، وأن الله ما كلّفك به إلا لأنه يعلم أن فيك ما يحتمله. وهذا في حد ذاته رسالة ثقة من الله في قدرتك."},{text:"وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ",source:"يوسف: 87",tafsir:"يعقوب عليه السلام قال هذا لأبنائه وقد فقد يوسف سنين طويلة، وفقد بنيامين أيضًا، وذهب بصره من الحزن. ومع ذلك لم ييأس. لأنه يعلم أن رحمة الله لا تنقطع، وأن الفرج قد يأتي من طريق لم يخطر على بال. هذه الآية دعوة لأن تبقى باب الأمل مفتوحًا مهما اشتد الظلام."},{text:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",source:"البقرة: 153",tafsir:"معية الله للصابرين ليست مجرد علم، بل تأييد وتثبيت ونصر. حين تصبر — أي تثبت وتستمر رغم الألم — فإن الله يمنحك قوة من عنده، قوة لا تأتي من عضلاتك ولا من إرادتك وحدها، بل من خالقك الذي اختار أن يكون معك."}],k=[{text:"«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلَا تَعْجَزْ»",source:"صحيح مسلم، 2664"},{text:"«المُؤْمِنُ القَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ المُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ»",source:"صحيح مسلم، 2664"},{text:"«عَجَبًا لأَمْرِ المُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ»",source:"صحيح مسلم، 2999"},{text:"«وَمَنْ يَتَصَبَّرْ يُصَبِّرْهُ اللَّهُ»",source:"صحيح البخاري، 1469"},{text:"«إِنَّ لِجَسَدِكَ عَلَيْكَ حَقًّا»",source:"صحيح البخاري، 5199"},{text:"«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ»",source:"صحيح البخاري"}],y=`القوة التي تحتاجها لا تعني أن تختفي مشاعرك أو تتحمل كل شيء وحدك. القوة أن تنظر إلى واقعك بصدق، ثم تختار ما تستطيع فعله بدل أن تبقى أسيرًا لفكرة أن عليك إصلاح كل شيء دفعة واحدة. قد تكون قوتك اليوم في النهوض، أو في طلب المساعدة، أو في قول «لا» لما يستنزفك، أو في أخذ راحة تعيد إليك قدرتك على المواصلة.

لا تنتظر أن يأتيك الحماس كاملًا حتى تبدأ؛ في أحيان كثيرة يظهر الدافع بعد أن تبدأ بخطوة بسيطة، كأن يتحرك الجسد فتتبعه النفس والروح. اجعل هدفك واضحًا وصغيرًا بما يكفي لتستطيع البدء اليوم، ثم ارفع مستوى التحدي تدريجيًا عندما تصبح الخطوة مألوفة. إن تعثّرت يومًا فلا تجعل التعثّر سببًا للتوقف، بل سببًا للمراجعة والعودة بوعية أكبر وخبرة أعمق.

تذكّر أن النجاح ليس وجهة واحدة تصل إليها ثم تتوقف، بل عادات يومية تكررها بصبر وثبات حتى تصبح جزءًا من هويتك. حين تكرّر العادة الصغيرة يومًا بعد يوم، فإنك لا تبني مهارة فحسب، بل تبني شخصية أقوى وأكثر انضباطًا. والأهم من الانضباط هو الرحمة: أن تكون رحيمًا مع نفسك حين تتعثر، صبورًا عليها حين تتعلم، ممتنًا لها حين تنجح. فأنت تستحق كل خير.`):/فرحان|ممتن|فرح/.test(p)?(j=[{text:"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ",source:"إبراهيم: 7",tafsir:"الشكر لا يزيد النعمة فقط، بل يزيد القلب رضا وسكينة. حين تشكر الله على ما أعطاك، تفتح بابًا للمزيد، لكن الأهم أنك تتحول من النظر إلى ما ينقصك إلى النظر إلى ما تملك. وهذا التحول في النظر هو بداية السعادة الحقيقية."},{text:"وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ",source:"الضحى: 11",tafsir:"التحدث بنعمة الله ليس تباهيًا، بل اعترافًا وامتنانًا. حين تذكر النعمة أمام الناس، تذكّرهم بأن الخير موجود، وتذكّر نفسك بأن الله كريم. والنعمة لا تنقص بالحديث عنها، بل تزيد لأن الحديث عنها نوع من الشكر."},{text:"فَبِذَٰلِكَ فَلْيَفْرَحُوا",source:"يونس: 58",tafsir:"الله سبحانه يأمر بالفرح — لكن بأي شيء؟ برحمته وفضله، لا بشيء من الدنيا. الفرح الحقيقي هو الفرح برحمة الله، لأن رحمته لا تنقطع ولا تُنزع. أما فرح الدنيا فيزول، وفرح الرحمة يبقى."},{text:"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",source:"الرعد: 28",tafsir:"حتى في الفرح، قلبك يحتاج إلى الطمأنينة. الفرح بدون ذكر الله قد يتحول إلى غرور أو نسيان. أما الفرح مع الذكر فهو امتنان يزيد النعمة ويثبتها في قلبك."}],k=[{text:"«انْظُرُوا إِلَى مَنْ أَسْفَلَ مِنْكُمْ، وَلَا تَنْظُرُوا إِلَى مَنْ هُوَ فَوْقَكُمْ، فَإِنَّهُ أَجْدَرُ أَنْ لَا تَزْدَرُوا نِعْمَةَ اللَّهِ»",source:"صحيح مسلم، 2963"},{text:"«الكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»",source:"صحيح البخاري ومسلم"},{text:"«عَجَبًا لأَمْرِ المُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ»",source:"صحيح مسلم، 2999"},{text:"«مَنْ لَمْ يَشْكُرِ النَّاسَ لَمْ يَشْكُرِ اللَّهَ»",source:"جامع أبي داود والترمذي"},{text:"«التَّائِبُونَ الْمُتَطَهِّرُونَ الْحَامِدُونَ»",source:"صحيح مسلم"}],y=`فرحتك تستحق أن تعيشها بهدوء، لا أن تقلق طوال الوقت من احتمال انتهائها. اسمح لنفسك أن تبتسم وتستمتع بما تحقق، مع تذكّر أن الامتنان لا يعني أن الحياة خالية من التحديات. اكتب ثلاث نعم محددة حدثت اليوم، واذكر كيف أثرت فيك، ثم اشكر الله عليها بقلب حاضر.

الامتنان ممارسة يومية، لا شعور يأتي بالصدفة. كلما درّبت نفسك على ملاحظة النعم الصغيرة — كوب ماء بارد، نوم هادئ، كلمة طيبة من صديق — زادت قدرتك على رؤية الخير في حياتك. والخير موجود دائمًا، لكن العين المعتادة على الشكوى لا تراه. غيّر عدسة نظرك، يتغير عالمك.

وفرحتك لا تكتمل إلا بمشاركتها. الكلمة الطيبة صدقة، والابتسامة في وجه أخيك صدقة، وإدخال السرور على قلب مؤمن من أعظم القربات. فحين تفرح، اجعل فرحك سببًا لفرح غيرك، يضاعف الله لك الأجر والسعادة.`):/حزين|مهموم|مكسور|وحدة|وحيد|خذلان|بكاء|أفتقد/.test(p)?(j=[{text:"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا",source:"الشرح: 5-6",tafsir:"هذه الآية بلسم لكل قلب حزين. الله لا يقول «بعد العسر يسر» بل «مع العسر يسر» — اليسر يرافق العسر، حتى في أثناء الحزن توجد رحمة. قد تكون الرحمة في صديق ساندك، أو في آية قرأتها، أو في دعاء استجيب لك، أو في قوة لم تعرف أنها فيك. انظر حولك، فاليسر قريب."},{text:"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",source:"الزمر: 53",tafsir:"الحزن قد يجعلك تشعر أن الأبواب كلها أُغلقت. لكن هذه الآية تكسر ذلك الشعور: رحمة الله أوسع من أي حزن، وأكبر من أي خطيئة، وأعمق من أي ألم. لا تيأس، فاليأس يحجبك عن الفرج، والرجاء يفتح لك أبوابًا ظننتها مغلقة."},{text:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",source:"البقرة: 153",tafsir:"الصبر على الحزن ليس أن تبتلع دمعتك وتتظاهر بالقوة. الصبر أن تحزن بكرامة، وتعبر عن ألمك بدعاء وذكر، وتستمر في الحياة رغم الثقل. الله معك في هذا الصبر — معية تثبتك وتقويك وتذكّرك أنك لست وحدك."},{text:"وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ",source:"يوسف: 87",tafsir:"يعقوب فقد يوسف سنين، وفقد بنيامين، وذهب بصره من كثرة البكاء. ومع ذلك قال لأبنائه: لا تيأسوا. لأنه يعلم أن رحمة الله تأتي من طرق لم نتوقعها. وقد جاء الفرج فعلاً — اجتمع شمله، وعاد بصره، ورأى يوسف بعد سنين طويلة. الفرج قادم، فقط لا تقطع حبل الرجاء."},{text:"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",source:"الرعد: 28",tafsir:"الحزن يضطرب القلب ويجعله كأنه معلّق في فراغ. الذكر يعيده إلى مكانه الطبيعي — متصلًا بخالقه. ليست الكثرة المطلوبة، بل الحضور. اذكر الله بكلمة واحدة من قلبك، وستشعر بأن شيئًا ثقيلًا بدأ يخف."}],k=[{text:"«وَمَنْ يَتَصَبَّرْ يُصَبِّرْهُ اللَّهُ»",source:"صحيح البخاري، 1469"},{text:"«مَا يُصِيبُ الْمُسْلِمَ مِنْ نَصَبٍ وَلَا وَصَبٍ وَلَا هَمٍّ وَلَا حَزَنٍ وَلَا أَذًى وَلَا غَمٍّ، حَتَّى الشَّوْكَةِ يُشَاكُهَا، إِلَّا كَفَّرَ اللَّهُ بِهَا مِنْ خَطَايَاهُ»",source:"صحيح البخاري ومسلم"},{text:"«عَجَبًا لأَمْرِ المُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ»",source:"صحيح مسلم، 2999"},{text:"«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ»",source:"صحيح البخاري"},{text:"«إِنَّ اللَّهَ قَالَ: أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ذَكَرَنِي»",source:"صحيح البخاري ومسلم"},{text:"«وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً، فَرَّجَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ»",source:"صحيح مسلم، 2699"}],y=`الحزن ليس دليلًا على ضعفك، ولا يعني أن الأمل انتهى. قد لا تستطيع تغيير سبب الألم في هذه اللحظة، لكن يمكنك أن تغيّر طريقة رعايتك لنفسك وأنت تمر به. اسمح لنفسك أن تشعر دون أن تصدر حكمًا قاسيًا عليها، ولا تقارن تعافيك بوقت تعافي الآخرين.

التعافي من الحزن ليس خطًا مستقيمًا. ستكون هناك أيام أفضل وأيام أصعب، وهذا طبيعي. لا تلم نفسك حين يعود الحزن — فهو يعود لأن ما حدث كان مهمًا لك، وليس لأنك فشلت في تجاوزه. خذ وقتك، واذكر أن العودة بعد التعثر أقوى من الكمال الذي لا يتحقق.

حين تشعر بالوحدة وسط الحزن، تذكّر أن الله أقرب إليك من حبل الوريد. تحدث إليه بلسانك أنت، بكلماتك التي تعرفها. لا تحتاج إلى بلاغة في الدعاء، بل إلى صدق. وإن كان الحزن شديدًا ويصعب تحمّله، فاطلب المساندة من شخص تثق به أو من مختص. طلب المساعدة شجاعة، لا ضعف.`):/قلق|خائف|خوف|متوتر|غاضب|عصبي|مرتبك|التشتت|الضغط/.test(p)?(j=[{text:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",source:"آل عمران: 173",tafsir:"هذه الكلمة قالها إبراهيم عليه السلام حين قيل له: إن الناس جمعوا لك جيشًا. لم يخف، بل قال: حسبنا الله ونعم الوكيل — أي الله كافينا، وهو المتولي لأمورنا. حين تقولها بصدق، فإنك تسلّم الأمر لمن بيده كل شيء، وتخفف عن نفسك حمل التفكير في كل الاحتمالات."},{text:"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا",source:"البقرة: 286",tafsir:"القلق يجعلك تشعر أن ما أمامك أكبر من قدرتك. هذه الآية تذكّرك أن الله يعلم قدرتك بالضبط، وما كلّفك به لا يفوقها. فإن بدا لك الأمر كبيرًا، فثق أن فيك ما يحتمله، وأن الله ما كلّفك إلا لأنه يعلم أنك تستطيع."},{text:"وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ",source:"الطلاق: 3",tafsir:"التوكل لا يعني التواكل — أن تجلس وتنتظر. التوكل أن تأخذ بالأسباب ثم تثق أن الله يكفيك. حين تتوكل، تتحول من القلق على النتيجة إلى الجهد في العمل، وتترك النتيجة لمن بيده النتائج."},{text:"فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ",source:"آل عمران: 159",tafsir:"القلق كثيرًا يأتي من التردد — ماذا أفعل؟ وماذا لو أخطأت؟ هذه الآية تعطيك منهجًا: عزم ثم توكل. اتخذ القرار بعد استشارة وتفكير، ثم امضِ وثق بالله. لا تنظر إلى الوراء بعد العزم، فالتردد يضاعف القلق."},{text:"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",source:"الرعد: 28",tafsir:"القلق اضطراب في القلب، والذكر هو العلاج المباشر. ليست الكثرة المطلوبة، بل الحضور والصدق. اذكر الله بكلمة واحدة وأنت تعنيها، ستجد أن ضربات قلبك بدأت تهدأ ولو قليلًا."}],k=[{text:"«لَا تَغْضَبْ»",source:"صحيح البخاري، 6116"},{text:"«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلَا تَعْجَزْ»",source:"صحيح مسلم، 2664"},{text:"«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ»",source:"صحيح البخاري"},{text:"«مَا أَنْزَلَ اللَّهُ دَاءً إِلَّا أَنْزَلَ لَهُ شِفَاءً»",source:"صحيح البخاري، 5678"},{text:"«إِنَّ اللَّهَ قَالَ: أَنَا عِنْدَ ظَنِّ عَبْدِي بِي»",source:"صحيح البخاري ومسلم"}],y=`عندما يرتفع القلق، يحاول العقل أحيانًا تقديم الاحتمالات المخيفة كأنها حقائق مؤكدة. لا تحتاج إلى تصديق كل فكرة تمر بك؛ قل لنفسك: هذه فكرة تقلقني، وليست بالضرورة ما سيحدث. عد إلى الحاضر، ولا تطلب من نفسك حل المستقبل كاملًا في جلسة واحدة.

ميّز بين ما تعرفه يقينًا وما تتوقعه أو تتخيله. اكتب مخاوفك على ورق، ثم ضع بجانب كل واحدة: هل هذا حقيقة أم احتمال؟ ما الدليل عليه؟ ما التفسير الآخر؟ هذا التمرين البسيط يخرج الأفكار من الدائرة المغلقة في رأسك ويجعلها أمام عينيك حيث يمكنك التعامل معها بوضوح.

العناية بنفسك في المرض تشمل الجسد والقلب معًا: اتبع إرشادات الطبيب، وخذ دواءك في وقته، واطلب المساعدة من أهلك دون خجل. وفي الوقت نفسه، اعتنِ بقلبك بالدعاء والذكر والرضا. الجسد والقلب متضامنان: حين يطمئن القلب، يهدأ الجسد، وحين يرتاح الجسد، يستعيد القلب قوته.

جرّب الآن هذا التمرين البسيط: خذ شهيقًا لطيفًا من الأنف لمدة 4 ثوانٍ، ثم أمسكه ثانيتين إن استطعت، وأخرج الزفير ببطء من الفم لمدة 6 ثوانٍ. كرّر ذلك ثلاث مرات. ستلاحظ أن جسدك بدأ يهدأ ولو قليلًا.

ثم اسأل نفسك بهدوء: ما الذي أعرفه يقينًا في هذا الموقف؟ وما الذي أتوقعه فقط أو أتخيله؟ افصل بين الحقائق والمخاوف، واكتبها على ورق إن استطعت. الكتابة تُخرج الأفكار من الدائرة المغلقة في رأسك وتجعلها أمام عينيك حيث يمكنك التعامل معها بوضوح.

﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾ — ذكر الله يُذكّر القلب أن هناك من بيده كل شيء، وأنك لست وحدك في هذا.`},{keywords:["حزين","حزن","كآبة","كئيب","بكاء","دموع","اكتئاب","كتئاب","يأس من الحياة"],reply:`أسمعك، وأقدّر أنك تشاركني ما تشعر به. الحزن ليس ضعفًا، بل استجابة طبيعية لأمر يؤلمك — قد يكون فقدان شخص، أو خيبة أمل، أو شعور بالوحدة، أو حتى تعب متراكم من أيام صعبة. لا تستعجل الشعور بالتحسّن، ولا تلم نفسك لأنك حزين. الحزن يحتاج وقتًا، تمامًا كما يحتاج الجرح وقتًا ليلتئم.

جرّب أن تكتب ما يحزنك في مساحة الفضفضة، أو حتى على ورقة عادية. إخراج المشاعر من الصدر إلى الورق يخفف حملها قليلًا. واذكر الله بكلمات بسيطة من قلبك، فالذكر صلة بينك وبين من يسمعك دائمًا.

إن كان الحزن شديدًا ويصعب تحمّله، أو إن راودتك أفكار بإيذاء نفسك، فأرجوك تواصل مع جهة متخصصة أو شخص تثق به. طلب المساعدة في هذه الحالة شجاعة، لا ضعف.

﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا﴾ — هذا وعد من الله، والوعد الحق لا يُخلف.`},{keywords:["غاضب","غضب","زعلان","نرفزة","عصبية","انفعلت","ثورة","غضبان"],reply:`الغضب شعور قوي وطبيعي، وأنت لست مضطرًا للتصرف فورًا بينما هو في أشده. حين يكون الغضب في ذروته، يفقد العقل قدرته على التقييم السليم، وقد نقول أو نفعل ما نندم عليه لاحقًا.

جرّب أن تأخذ مهلة قصيرة قبل الرد أو القرار: تنفّس ببطء، وإن استطعت تغيير مكانك أو الخروج لتمشي قليلًا فافعل. الجسد في حركة يفرغ شيئًا من طاقة الغضب.

حين تهدأ قليلًا، جرّب أن تعبّر عن شعورك بجملة تبدأ بـ«أنا» بدل أن تهاجم: «أنا غاضب لأن…» بدل «أنت دائمًا…». هذا يوضّح لك وللطرف الآخر سبب الغضب دون أن يزيد الاحتقان.

إن كان الأذى متكررًا من طرف معين، فمن حقك أن تضع حدًا واضحًا ومحترمًا. الرفق لا يعني قبول الظلم.

قال النبي ﷺ: «لَا تَغْضَبْ» — وفيها حكمة عميقة: ليس النهي عن الشعور، بل عن أن يتحكم الغضب في تصرفاتك.`},{keywords:["وحيد","وحدة","لوحدي","محد","غريب","محد معي","مشاراني","لا أحد"],reply:`الشعور بالوحدة ثقيل، وأنا أتفهمه تمامًا. أحيانًا لا نحتاج حلًا فوريًا، بل شخصًا يسمعنا دون أن يحكم علينا. الشعور بالوحدة لا يعني أنك غير محبوب، بل قد يعني أنك تمر بظرف جعل الناس بعيدين عنك ولو مؤقتًا.

جرّب التواصل مع شخص تثق به ولو برسالة قصيرة: «كيف حالك؟ أحتاج من يسمعني قليلًا». أحيانًا خطوة صغيرة كهذه تفتح بابًا لم تكن تتوقعه. وإن لم تستطع الآن، فاكتب ما بداخلك هنا أو في مساحة الفضفضة — الكتابة نفسها نوع من المحادثة مع النفس.

وتذكّر أن الله أقرب إليك من حبل الوريد، وأنه يسمعك حين تناجيه. الذكر والمناجاة يملآن الفراغ الذي لا يملؤه بشر.

﴿وَهُوَ مَعَكُمْ أَيْنَ مَا كُنْتُمْ﴾ — أينما كنت، ولو وحدك في غرفة مظلمة، فهو معك.`},{keywords:["تعب","مرهق","إرهاق","منهك","ما أقدر","تعبت","ما عندي طاقة","محترق"],reply:`أقدّر تعبك، وأريد أن أذكّرك بشيء مهم: لا يُطلب منك أن تكون قويًا طوال الوقت. الإرهاق المستمر ليس علامة فشل، بل علامة أن جسدك ونفسك يحتاجان راحة حقيقية، لا مجرد نوم سريع ثم عودة للضغط.

اختر اليوم شيئًا واحدًا فقط تؤديه، وامنح نفسك راحة دون شعور بالذنب. الراحة ليست جائزة تُمنح بعد الإنهاك، بل جزء من الاستمرار. النوم الجيد والطعام المناسب والابتعاد عن الشاشة قبل النوم — كلها جزء من العناية بنفسك التي تستحقها.

إن كان التعب جسديًا مستمرًا، فقد يحتاج جسدك إلى فحص طبي. وإن كان تعبًا نفسيًا، فالفضفضة وطلب المساندة من شأنها أن تخفف. لا تحمل كل العبء وحدك.

﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾ — الله يعلم قدرتك، ولا يطلب منك ما لا تطيق.`},{keywords:["يأس","قنوط","مستحيل","خلاص","مافي أمل","ما في فايدة","انسحبت","استسلمت"],reply:`أتفهم أنك تمر بلحظة ثقيلة جدًا. اليأس شعور مؤلم، لكنه شعور، وليس حقيقة نهائية عن مستقبلك. حين ينظر القلب من خلال عدسة اليأس، يرى كل شيء مظلمًا، تمامًا كما يرى الشخص من خلف زجاج مغبّر. لكن الزجاج يُنظّف، والنظر يتغيّر.

لست مطالبًا برؤية الطريق كله، فقط الخطوة التالية. ما هو أمر واحد صغير — ولو بسيط جدًا — يمكنك فعله اليوم؟ شرب كوب ماء؟ الاتصال بشخص؟ كتابة سطر؟ كل خطوة صغيرة هي فعل رجاء، حتى لو لم تشعر بذلك.

إن كانت أفكار اليأس شديدة وتدفعك لإيذاء نفسك، فأرجوك — أرجوك — تواصل الآن مع جهة متخصصة أو شخص تثق به. حياتك أمانة، وهناك من يريد مساعدتك ولو لم تعرفه بعد.

﴿وَلَا تَيْأَسُوا مِنْ رَوْحِ اللَّهِ﴾ — رحمة الله أوسع من كل يأس، وهي قادرة على أن تصل إليك في أشد اللحظات.`},{keywords:["مساعد","ساعدني","أحتاج مساعدة","ما الحل","وش أسوي","ما عرفت","دلني"],reply:`أنا معك 🤍 أخبرني أكثر عن وضعك: ما الذي تشعر به تحديدًا؟ هل هو قلق، أم حزن، أم غضب، أم تعب، أم شعور بالوحدة؟ كلما وضحت أكثر، استطعت أن أساندك بطريقة أنسب.

• صفحة «التنفس» — تمرين تنفس لطيف مع ذكر اختياري
• صفحة «المسبحة» — ذكر يطمئن القلب
• صفحة «الفضفضة» — مساحة كتابة خاصة وآمنة

أنا هنا، خذ وقتك.`},{keywords:["شكر","شكرا","مشكور","ممتن","thank"],reply:`العفو 🤍 أنا هنا من أجلك في أي وقت تحتاج فيه من يسمعك. لا تتردد في العودة متى شعرت بثقل أو احتجت مساندة. وكل خير في هذا التطبيق من الله، والفضل له سبحانه.

﴿وَقُلْ رَبِّ زِدْنِي عِلْمًا﴾`},{keywords:["ذنب","مذنب","تأنيب","ندمان","ندم","قصرت","سامحني","أخطأت"],reply:`أشعر من كلامك أن ضميرك يضغط عليك 🤍 إذا أخطأت فعلًا، فالشجاعة ليست في جلد نفسك، بل في الاعتراف بالخطأ وإصلاح ما تستطيع وإعطاء نفسك فرصة للتعلّم. اسأل نفسك: ما الشيء المحدد الذي أستطيع إصلاحه اليوم؟ إن كان هناك شخص تأذّى، فاعتذار صادق وخطوة عملية قد يكونان بداية جيدة. وإن كان الأمر خارج قدرتك الآن، فخذ الدرس واترك العقاب المستمر؛ أنت إنسان تتعلم، ولست خطأك وحده.`},{keywords:["فقدت","وفاة","متوفى","مات","اشتقت لميت","فقدان شخص","عزاء","حزن على"],reply:`الفقد يترك مكانًا فارغًا لا تملؤه الكلمات بسهولة، ومن الطبيعي أن تتقلب بين الحزن والاشتياق والذهول. لا تُلزم نفسك بأن تتجاوز الأمر بسرعة، ولا تقارن حزنك بحزن غيرك. حاول اليوم أن تتحدث عن الشخص الذي تفتقده مع من يفهمك، أو تكتب ذكرى جميلة عنه. خذ الأمور ساعة بساعة، واسمح لنفسك بالبكاء إن احتجت. إن أثقل الحزن يومك طويلًا، فطلب المساندة من شخص موثوق أو مختص ليس ضعفًا.`},{keywords:["فشلت","فشل","خسرت","خسارة","ما نجحت","رسوب","راسب","خيبت"],reply:`الإخفاق مؤلم، خصوصًا عندما بذلت جهدًا أو علّقت أملًا كبيرًا على النتيجة. لكنه يخبرك أن طريقةً ما لم تنجح هذه المرة، ولا يحكم على قيمتك أو مستقبلك كله. خذ وقتًا لتهدأ، ثم افصل بين ما حدث فعلًا وبين الحكم القاسي الذي تقوله لنفسك. اختر درسًا واحدًا وخطوة صغيرة قابلة للتنفيذ، واطلب رأيًا من شخص تثق بخبرته. لا تحتاج إلى إصلاح كل شيء الليلة؛ يكفي أن تبدأ من نقطة واحدة.`},{keywords:["ضغط","مضغوط","مسؤوليات","مسؤولية","متراكم","مهام كثيرة","مشغول جدًا","فوق طاقتي","مرتبك من كثرة"],reply:`حين تتجمع المسؤوليات، قد يبدو كل شيء عاجلًا في الوقت نفسه. توقّف دقيقة واكتب ما يشغل بالك، ثم اختر مهمة واحدة ضرورية فقط وابدأ بها لعشر دقائق. أجّل ما يمكن تأجيله، واطلب مساعدة محددة بدل محاولة حمل كل شيء وحدك. ليس مطلوبًا منك أن تكون متاحًا للجميع طوال الوقت، والراحة جزء من القدرة على الاستمرار.`},{keywords:["ما أنام","ما اقدر أنام","أرق","سهران","النوم","نومي","كوابيس","أرقان"],reply:`صعوبة النوم مرهقة، ومحاولة إجبار نفسك على النوم قد تزيد التوتر. خفّف الإضاءة، وأبعد الهاتف قليلًا، وخذ أنفاسًا هادئة مع إرخاء الكتفين والفك. إذا بقيت مستيقظًا، جرّب نشاطًا هادئًا بإضاءة خافتة ثم عد إلى الفراش عندما تشعر بالنعاس. لا تراقب الساعة باستمرار، ولا تلُم نفسك على ليلة صعبة. إذا تكرر الأرق وأثر في يومك، فاستشارة مختص صحي قد تساعدك.`},{keywords:["ما أركز","تركيز","مشتت","تشتت","تسويف","أأجل","أجل كل شيء","ما أبدأ","كسلان","كسل"],reply:`قد لا يكون ما تسميه كسلًا إلا إرهاقًا أو مهمة تبدو كبيرة وغير واضحة. صغّر البداية إلى خطوة تستغرق خمس دقائق، وضع الهاتف بعيدًا خلال هذه المدة. لا تنتظر الحماس الكامل؛ ابدأ قليلًا ثم قيّم طاقتك. وبعد كل فترة قصيرة خذ استراحة بسيطة. إذا كان ذهنك مشتتًا بسبب همّ محدد، اكتبه جانبًا وقل لنفسك إنك ستعود إليه بعد انتهاء الخطوة الحالية.`},{keywords:["ثقتي بنفسي","ما أثق بنفسي","عديم القيمة","ما أسوى","ما أستاهل","أكره نفسي","أقل من غيري","أحس بالنقص"],reply:`أعرف أن مقارنة نفسك بالآخرين أو تكرار الكلام القاسي داخلك قد يجعلك ترى عيوبك فقط. لكن شعورك بأنك بلا قيمة ليس دليلًا على أنه حقيقة. حاول أن تتحدث مع نفسك كما تتحدث مع شخص تحبه: بإنصاف ورحمة. اكتب صفة واحدة جيدة فيك، أو موقفًا تجاوزته، أو أمرًا صغيرًا قمت به اليوم. لست مطالبًا بأن تكون كاملًا حتى تستحق الاحترام والراحة.`},{keywords:["انخذلت","خيبة أمل","خذلان","خيّب","خيبة","ما توقعت منه","انصدمت من","خذلني"],reply:`الخذلان مؤلم لأنه يأتي أحيانًا من مكان كنا نتوقع منه الأمان. لا تستعجل تبرير ما حدث ولا اتخاذ قرار كبير وأنت في قمة الألم. امنح نفسك مساحة، وميّز بين ما تعرفه وما تفترضه، ثم فكّر في الحدود التي تحتاجها لحماية قلبك. يمكنك أن تسامح إن اخترت ذلك من دون أن تسمح بتكرار الأذى، ومن حقك أن تطلب وضوحًا واحترامًا.`},{keywords:["متردد","محتار","ما أعرف أختار","قرار","أخاف أقرر","ضايع","ما أدري وش أبغى","مش عارف"],reply:`الحيرة لا تعني أنك عاجز عن الاختيار؛ قد تعني أن الخيارات مهمة لك أو أن المعلومات لم تكتمل بعد. اكتب خيارين أو ثلاثة، وما الذي يهمك في كل خيار، وما أسوأ احتمال واقعي وكيف ستتعامل معه. حدّد إن كان القرار قابلًا للتعديل أم لا، واستشر شخصًا حكيمًا يعرف ظروفك. ثم اختر الخطوة التالية المعقولة، لا القرار المثالي الذي يضمن كل شيء.`},{keywords:["غيرة","أغار","أغير من","أقارن نفسي","يغارون مني","حسد"],reply:`الغيرة قد تكشف عن شيء تتمنى وجوده في حياتك، ولا يلزم أن تحوّلها إلى لوم لنفسك أو للآخرين. لاحظ ما الذي أثارها تحديدًا: هل هو احتياج للاهتمام، أو خوف من الفقد، أو رغبة في إنجاز معين؟ حوّل الشعور إلى طلب واضح أو هدف صغير تعمل عليه، وذكّر نفسك أن نجاح شخص آخر لا يسلبك فرصتك ولا يقلل من قيمتك.`},{keywords:["ملل","طفشان","طفش","زهقان","زهق","ما في شيء","الفراغ"],reply:`الملل قد يكون إشارة إلى حاجتك لتغيير بسيط أو راحة من الروتين. لا تحتاج إلى إنجاز كبير الآن؛ اختر شيئًا واحدًا مختلفًا: امشِ قليلًا، رتّب زاوية صغيرة، اتصل بشخص تحبه، اقرأ صفحة، أو جرّب هواية لدقائق. وإذا كان الملل مصحوبًا بفقدان المتعة والحزن لفترة طويلة، فانتبه لمشاعرك واطلب دعمًا مناسبًا.`},{keywords:["فرحان","سعيد","مبسوط","نجحت","نجاح","خبر حلو","فرحة","متحمس"],reply:`يا سلام، جميل أن في قلبك مساحة للفرح اليوم 🤍 اسمح لنفسك أن تستمتع بهذه اللحظة من دون أن تقلق من انتهائها. لاحظ ما الذي أسعدك، واشكر الله على النعمة، وشارك فرحتك مع شخص تحبه إن رغبت. ويمكنك أن تحفظ هذه اللحظة في مذكرتك لتعود إليها في الأيام الثقيلة. الفرح ليس أمرًا تافهًا؛ إنه أيضًا شيء يستحق أن نمنحه وقتًا.`},{keywords:["مشتاق","اشتياق","أشتاق","بعيد عن أهلي","وحشتني","حنين"],reply:`الاشتياق دليل على أن هناك أشخاصًا أو أماكن تركت أثرًا في قلبك. لا تحاول طرد الشعور بالقوة؛ اسمح له أن يمر، وربما أرسل رسالة أو اتصل بمن تشتاق إليه إن كان ذلك مناسبًا. وإن لم يكن التواصل ممكنًا، فاكتب ما كنت تتمنى قوله أو استحضر ذكرى طيبة. يمكنك أن تفتقد أحدًا وتواصل حياتك في الوقت نفسه.`},{keywords:["مكسور","انفصال","تركني","تركتني","انفصلنا","قلبي موجوع","حب من طرف واحد","هجرني"],reply:`وجع العلاقة قد يجعلك تعيد الأحداث وتبحث عن إجابة لكل سؤال. امنح نفسك وقتًا، وقلّل ما يعيد فتح الجرح إن كان يؤذيك، مثل متابعة الأخبار أو الرسائل باستمرار. تذكّر أن انتهاء علاقة لا يعني انتهاء قدرتك على الحب أو أنك غير جدير به. استند إلى شخص أمين، واهتم بالنوم والطعام والروتين البسيط حتى تستعيد توازنك تدريجيًا.`},{keywords:["خجلان","محرج","إحراج","فضحت نفسي","أستحي","خجل"],reply:`الإحراج يجعلنا نشعر كأن الجميع يراقبنا، بينما غالبًا يكون الآخرون منشغلين بأنفسهم أكثر مما نتخيل. خذ نفسًا، وذكّر نفسك أن موقفًا محرجًا لا يختصر شخصيتك. إن احتجت إلى تصحيح شيء فافعله بهدوء، وإن لم يكن هناك ما يلزم إصلاحه فاسمح للموقف أن يمر. ستخف حدته مع الوقت، ويمكنك أن تتعامل معه برفق بدل إعادة محاكمته في ذهنك.`},{keywords:["غضبان من نفسي","محبط","إحباط","ما في فايدة","طفشت من كل شيء","مستنزف","منهار"],reply:`يبدو أنك وصلت إلى حدّ من الإنهاك يجعل كل شيء أثقل مما هو عليه. لا تتخذ أحكامًا نهائية عن حياتك وأنت مستنزف. ركّز الآن على الأساسيات: ماء، وراحة، وطعام إن استطعت، ثم تواصل مع شخص تثق به وقل له بوضوح إنك تحتاج إلى وجوده. بعد أن تهدأ قليلًا، يمكننا تقسيم ما يضغط عليك إلى خطوات أصغر. لست مضطرًا لمواجهة كل شيء وحدك.`},{keywords:["أشتاق","اشتياق","مشتاق","الحنين","حنين"],reply:`الاشتياق دليل أن لهذا الشخص أو الزمن مكانة في قلبك. لا تلُم نفسك على الحنين، وخذ مشاعرك برفق. إن كان التواصل مناسبًا وآمنًا، يمكنك إرسال رسالة بسيطة، وإن لم يكن فامنح نفسك مساحة لتكتب ما تود قوله دون أن ترسله. ما الذي تفتقده أكثر: الشخص أم الشعور الذي كان يمنحك إياه؟`},{keywords:["خذلان","خذلني","مخذول","انكسرت ثقتي"],reply:`أعرف أن الخذلان يؤلم أكثر حين يأتي ممن وثقنا بهم. لا تحتاج إلى تجاوز الأمر بسرعة أو تبرير ما حدث. خذ وقتك، وميّز بين مسامحة القلب وبين إعادة الثقة؛ فالثقة تُبنى بالأفعال والوقت. ما حدث لا يقلل من قيمتك ولا يجعل كل الناس متشابهين.`},{keywords:["المستقبل","خايف من بكرة","خوف من الغد","قلق من القادم"],reply:`من الطبيعي أن يقلقك ما لا تعرفه عن المستقبل، لكن ليس عليك أن تحمل كل الأيام القادمة الآن. عُد إلى يومك: ما الشيء الصغير الذي تستطيع فعله خلال الساعة القادمة؟ ركّز على ما تملكه اليوم، ودع بقية الطريق يتضح خطوة بعد خطوة.`},{keywords:["تأنيب الضمير","أشعر بالذنب","حاسس بالذنب","ندمان","الندم"],reply:`إن كان هناك خطأ ندمت عليه، فندمك يمكن أن يكون بداية إصلاح لا حكمًا دائمًا على نفسك. اعترف بما حدث بصدق، واعتذر أو أصلح ما تستطيع، ثم تعلّم منه. أنت مسؤول عن أفعالك، لكنك لست مضطرًا إلى معاقبة نفسك إلى الأبد.`},{keywords:["ثقتي بنفسي","ما أثق بنفسي","عديم الثقة","أقل من غيري","أكره شكلي"],reply:`قيمتك لا تُقاس بمقارنة نفسك بالآخرين ولا بلحظة ضعف تمر بها. حاول أن تتحدث مع نفسك بعدل، وتذكّر شيئًا واحدًا تجاوزته أو أحسنت فعله، مهما بدا صغيرًا. الثقة تنمو بالممارسة والرفق، لا بالإهانة والضغط.`},{keywords:["محتار","حيرة","متردد","لا أعرف ماذا أختار","ما أدري ماذا أفعل"],reply:`حين تحتار، ليس مطلوبًا أن تعرف الإجابة كاملة فورًا. اكتب الخيارات أمامك، وما الذي يهمك في كل خيار، وما أسوأ نتيجة واقعية يمكن التعامل معها. إذا لم يكن القرار عاجلًا، امنح نفسك وقتًا قصيرًا للتفكير ثم اختر الخطوة الأكثر اتزانًا.`},{keywords:["أغار","الغيرة","أشعر بالغيرة","أقارن نفسي"],reply:`الغيرة قد تخبرك أن هناك احتياجًا أو خوفًا بداخلك، لكنها لا تعني أنك شخص سيئ. حاول أن تفهم ما وراءها: هل تحتاج إلى طمأنينة، أم تقدير، أم وضوح؟ عبّر عن احتياجك بهدوء، وتجنب اتخاذ قرار أو اتهام وأنت في ذروة الشعور.`},{keywords:["ملان","ملل","طفشان","زهقان","لا شيء يحمسني"],reply:`الملل أحيانًا إشارة إلى حاجتك لتغيير بسيط أو راحة من الروتين. لا تنتظر أن يأتي الحماس أولًا؛ اختر نشاطًا صغيرًا لعشر دقائق: مشي، ترتيب زاوية، سماع شيء تحبه، أو الحديث مع شخص قريب. وإن كان فقدان المتعة مستمرًا ويثقل يومك، فمشاركة ذلك مع شخص تثق به خطوة مهمة.`},{keywords:["ضغط المسؤوليات","مسؤوليات كثيرة","كل شيء فوق رأسي","مضغوط جدًا","أعباء كثيرة"],reply:`يبدو أن عليك أشياء كثيرة في وقت واحد، وهذا مرهق فعلًا. لست مطالبًا بإنجاز كل شيء الآن. اكتب المهام، وحدد واحدة ضرورية وأخرى يمكن تأجيلها، واطلب المساعدة في أمر محدد إن أمكن. الراحة ليست تقصيرًا؛ إنها تساعدك على الاستمرار.`},{keywords:["فرحان","سعيد","فرح","نجحت","ممتن","مبسوط"],reply:`يسعدني أن في قلبك مساحة للفرح 🤍 اسمح لنفسك أن تعيش هذه اللحظة دون التقليل منها أو انتظار أن تكتمل كل الأمور. خذ لحظة لتقدّر ما حدث، وشارك فرحتك مع من تحب إن رغبت. ما أجمل شيء تريد أن تحتفظ به من هذا اليوم؟`}],Pf=`أنا معك 🤍 أخبرني أكثر عن شعورك بكلماتك، وسأحاول أن أساندك بما يناسب حالتك. إن كنت تشعر بالقلق أو الحزن أو الغضب أو التعب أو الوحدة، صف لي ما يدور في داخلك وسأرد عليك بكلمات تطمئن قلبك وخطوات تساعدك.

يمكنك أيضًا استكشاف صفحة المشاعر أو التنفس أو المسبحة أو مساحة الفضفضة في أي وقت.

عل هاتفك أداة لا سارقًا",desc:"الإشعارات المتواصلة تجزئ الانتباه. أنت من يحدد متى تستخدم الجهاز.",action:"أوقف إشعارين غير ضروريين اليوم."},{title:"سامح دون قبول الأذى",desc:"يمكن أن تخفف حمل الغضب مع الحفاظ على حدودك وسلامتك.",action:"حدّد الحد الذي تحتاجه قبل أي مصالحة."},{title:"تحدث مع نفسك باحترام",desc:"الكلام الداخلي القاسي لا يجعل التغيير أسهل. استخدم لغة واقعية تشبه ما تقوله لصديق.",action:"استبدل «أنا فاشل» بـ«هذه المحاولة لم تنجح، وسأتعلم منها»."},{title:"خطط للأسبوع لا لكل العمر",desc:"التخطيط القريب يسمح لك بالتعديل حسب الظروف بدل القلق من مستقبل بعيد.",action:"اختر هدفين واقعيين للأيام السبعة القادمة."},{title:"اصنع مساحة هادئة",desc:"البيئة تؤثر في سهولة التركيز والراحة. لا تحتاج غرفة مثالية؛ زاوية مرتبة قد تكفي.",action:"رتّب سطحًا واحدًا لمدة خمس دقائق."},{title:"تعامل مع النقد بتمييز",desc:"ليس كل نقد صحيحًا، وليس كل نقد عديم الفائدة. افصل بين النبرة والمعلومة.",action:"اسأل: هل توجد نقطة محددة يمكنني تعلمها؟"},{title:"استخدم الامتنان دون إنكار الألم",desc:"يمكنك ملاحظة نعمة صغيرة مع الاعتراف بأن هناك أمرًا يؤلمك.",action:"اكتب شيئًا ممتنًا له وشيئًا تحتاج فيه إلى دعم."},{title:"درّب نفسك على التركيز",desc:"التركيز مهارة تتطور بالتدريب القصير المتكرر.",action:"اختر مهمة واحدة واضبط 10 دقائق لها."},{title:"ضع حدودًا للتفكير الليلي",desc:"قد يضخم التعب الأفكار ليلًا. تدوين ما يقلقك مع خطوة للغد قد يساعدك.",action:"اكتب: سأراجع هذا غدًا في الساعة… ثم عد لروتين النوم."},{title:"تقبّل التغيير التدريجي",desc:"النتائج الكبيرة تتكون من خطوات صغيرة متكررة، وقد تتخللها أيام أبطأ.",action:"اختر عادة واحدة وكررها ثلاث مرات هذا الأسبوع."},{title:"وازن بين الإنجاز والراحة",desc:"العمل المستمر بلا استراحة قد يقلل الجودة والطاقة.",action:"ضع استراحة قصيرة بعد مهمة تحتاج تركيزًا."},{title:"ابدأ من جديد بلا جلد ذات",desc:"يمكنك مراجعة ما حدث دون تحويله إلى إدانة لنفسك. البداية الجديدة قرار عملي صغير.",action:"اختر شيئًا واحدًا ستعود إليه اليوم."}],Rf=["التغيير المستمر لا يأتي عادة من قرار ضخم واحد، بل من خطوات صغيرة تتكرر حتى تصبح أسهل. لا تنتظر أن تكون ظروفك مثالية؛ ابدأ بما تملكه الآن، وعدّل خطتك عندما تتغير ظروفك.","عامل نفسك كإنسان تتمنى له الخير: شجّع نفسك على المحاولة، وراجع أخطاءك بهدوء بدل أن تحوّلها إلى حكم على شخصيتك. التقدم قد يكون بطيئًا، لكنه يظل تقدمًا إذا كان واقعيًا وآمنًا.","تذكّر أن النصائح أدوات وليست قوانين تنطبق على الجميع. خذ منها ما يناسب حياتك، واطلب دعمًا من شخص موثوق أو مختص إذا كانت المشكلة أكبر من أن تتحملها وحدك."],Df="لا تنتظر أن يأتيك الحماس كاملًا حتى تبدأ؛ في أحيان كثيرة يظهر الدافع بعد أن تبدأ بخطوة بسيطة، كأن يتحرك الجسد فتتبعه النفس والروح. اجعل هدفك واضحًا وصغيرًا بما يكفي لتستطيع البدء اليوم، ولا تحتقر الخطوة الصغيرة فإن النهر يبدأ بقطرات، والجبل يبدأ بحصى. ثم ارفع مستوى التحدي تدريجيًا عندما تصبح الخطوة مألوفة، وكافئ نفسك على الإنجاز ولو كان بسيطًا، فإن النفس تحب الثناء وتستبشر بالتقدم. إن تعثّرت يومًا فلا تجعل التعثّر سببًا للتوقف، بل سببًا للمراجعة والعودة بوعية أكبر وخبرة أعمق. وتذكّر أن الرحلة الطويلة لا تُقطع إلا بخطوة واحدة في كل مرة، وأن من واصل الوصل، ومن انقطع ضاع في منتصف الطريق.",Mf="إن التحفيز الحقيقي لا يأتي من خارجك فقط، بل من إيمانك بأنك تستطيع، ومن إدراكك أن كل جهد تبذله — ولو كان صغيرًا — يبني نسخة أقوى منك. لا تقارن بدايتك بمنتصف غيرك، فلكل إنسان ظروفه وسرعته وأبوابه. قد ترى شخصًا ينجح بسرعة وأنت تتعثّر، لكنك لا تعرف كم مرّ من صعوبات خلف الكواليس. اجعل معيارك الوحيد هو أن تكون اليوم أفضل من الأمس ولو بشعرة. إن شعرت بالملل أو الإحباط، فغيّر المكان أو الطريقة أو الوقت، ولا تترك الهدف. إن تعب الجسد فاسترح، وإن تعب القلب فادعُ الله واطلب المساندة، وإن تعب العقل فخذ استراحة ثم عُد. ما يهم هو أن لا تتوقف تمامًا، وأن تجعل العودة دائمًا خيارًا متاحًا لك.",If="النجاح ليس وجهة واحدة تصل إليها ثم تتوقف، بل عادات يومية تكررها بصبر وثبات حتى تصبح جزءًا من هويتك. حين تكرّر العادة الصغيرة يومًا بعد يوم، فإنك لا تبني مهارة فحسب، بل تبني شخصية أقوى وأكثر انضباطًا. ولا يعني الانضباط القسوة مع النفس، بل يعني الرعاية الواعية: أن تطعم جسدك ما ينفعه، وأن تعطي عقلك ما ينمّيه، وأن تمنح قلبك ما يطمئنه. إن كسرت العادة يومًا أو يومين، فالأهم هو أن تعود، لا أن تعاقب نفسك. العودة بعد الكسر أقوى من ا
