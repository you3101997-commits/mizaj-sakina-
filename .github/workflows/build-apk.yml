name: Build Mizaj Sakina Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/mizaj/sakina/MainActivity.kt
          test -f app/src/main/java/com/mizaj/sakina/ReminderScheduler.kt
          test -f app/src/main/java/com/mizaj/sakina/DailyReminderWorker.kt
          test -f app/src/main/java/com/mizaj/sakina/NotificationHelper.kt
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mizaj-Sakina-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
